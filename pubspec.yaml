name: vietread
description: "VietRead — đọc và đăng truyện chữ (Flutter + FastAPI + SQL Server)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Giao diện tiếng Việt cho widget hệ thống (Phần A: ngôn ngữ Tiếng Việt)
  flutter_localizations:
    sdk: flutter

  # --- Gọi API (Phần A1) ---
  http: ^1.2.0

  # --- Lưu cục bộ trên điện thoại (Phần A1/A4) ---
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # --- Ảnh bìa (Phần A1) ---
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Font bundle (A2): UI = Be Vietnam Pro (sans-serif), nội dung chương = Noto Serif
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-400.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-600.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-700.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-700.ttf
          weight: 700
